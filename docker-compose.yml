services:
  stremioarrs:
    build: .
    container_name: stremioarrs
    init: true
    restart: unless-stopped
    ports:
      - "5100:5100"
    environment:
      - OMDB_API_KEY=${OMDB_API_KEY:-}
      - CUSTOM_ADDONS=${CUSTOM_ADDONS:-}
      - DISABLED_PROVIDERS=${DISABLED_PROVIDERS:-}
      - FETCH_ALL_TIMEOUT=${FETCH_ALL_TIMEOUT:-5.5}
      - CONNECT_TIMEOUT=${CONNECT_TIMEOUT:-2.0}
      - READ_TIMEOUT=${READ_TIMEOUT:-4.0}
      - CB_FAILURE_THRESHOLD=${CB_FAILURE_THRESHOLD:-3}
      - CB_COOLDOWN_SECONDS=${CB_COOLDOWN_SECONDS:-180}
